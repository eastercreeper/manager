# Merge this service into your EXISTING compose project.
# Also add "8787:8787/tcp" to the ports list on your existing tailscale service.
services:
  anime-manager:
    container_name: anime-manager
    # Set APP_UID/APP_GID to an ACL-compatible dataset identity; the image never falls back to root.
    build:
      context: /mnt/.ix-apps/app_mounts/anime-manager
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    depends_on:
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - DB_PATH=/data/anime-manager.sqlite3
      - DATA_DIR=/data
      - LIBRARY_DIR=/ivan/Shows
      - DOWNLOAD_DIR=/downloads
      - QBITTORRENT_SAVE_PATH=/downloads/anime
      - NYAA_BASE=https://nyaa.si/
      - TSUKIHIME_BASE=https://api.tsukihime.org/v1
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - QBITTORRENT_URL=http://127.0.0.1:30024
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - QBITTORRENT_CATEGORY=anime
      - MIN_QUALITY=1080p
      - SCAN_INTERVAL_MINUTES=30
    volumes:
      - anime_manager_data:/data
      - /mnt/Jellyfin/JellyfinData/JP-BEAN/Shows:/ivan/Shows
      - /mnt/.ix-apps/app_mounts/qbittorrent/downloads:/downloads
volumes:
  anime_manager_data:
