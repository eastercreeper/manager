name: Import Seanime upstream source

on:
  push:
    branches:
      - rewrite/go-backend

permissions:
  contents: write

concurrency:
  group: seanime-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-seanime]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import pinned upstream source
        run: bash .github/scripts/import-seanime.sh
      - name: Commit vendored upstream source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/seanime
          if git diff --cached --quiet; then
            echo "Pinned Seanime source is already up to date."
            exit 0
          fi
          git commit -m "Import Seanime upstream backend source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
