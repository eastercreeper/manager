name: Go rewrite CI

on:
  push:
    branches:
      - rewrite/go-backend
  pull_request:
    branches:
      - rewrite/go-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./internal/jellyfin/... ./internal/manager/...
      - name: Build full application
        run: go build -trimpath -o /tmp/anime-manager .
      - name: Vet manager integration
        run: go vet ./internal/jellyfin/... ./internal/manager/...
