name: Go rewrite CI

on:
  push:
    branches:
      - rewrite/go-backend
  pull_request:
    branches:
      - rewrite/go-backend

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
